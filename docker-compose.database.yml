# Development migration sandbox only. Always select this file explicitly.
name: resume-database-dev
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resume_matcher_dev}
      # The official image creates POSTGRES_USER as SUPERUSER. Never use a runtime role here.
      POSTGRES_USER: resume_bootstrap_admin
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Set a separate bootstrap password in .env.database}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set a separate migrator password}
      APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set a separate application password}
      READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:?Set a separate reporting password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/database-init.sh:/docker-entrypoint-initdb.d/10-database-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_bootstrap_admin -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

# Compose scopes both the volume and network to this isolated project.
volumes:
  postgres-data:
