name: hr-ai-resume-selection

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: hr-ai-resume-selection-backend:1.0.0
    container_name: hr-ai-resume-selection-backend
    restart: unless-stopped
    env_file:
      # required: true —— 缺少 .env 时【拒绝启动】，而不是静默回退到源码默认值。
      # 源码里的默认 JWT/SESSION 密钥与默认 ADMIN_EMAILS 都是公开的：靠默认值启动
      # 等于把签发 token 的密钥和超级管理员身份一起公开发布。
      # 首次部署：cp apps/backend/.env.sample apps/backend/.env 并填好密钥。
      - path: apps/backend/.env
        required: true
    environment:
      # 注意：不要在 environment 里设置 ENV —— 它的优先级高于 env_file，
      # 会覆盖 .env 里的 ENV=production，导致生产模式校验失效。
      # ENV 与密钥均从 apps/backend/.env 读取；无 .env 时回退 local。
      LOG_DIR: /app/logs
    ports:
      # 后端只绑回环：前端容器通过 compose 内网 http://backend:8000 访问它，
      # 外部流量一律经 nginx 反代进入，不需要把 API 直接暴露到公网。
      - "127.0.0.1:8000:8000"
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
    healthcheck:
      # 用 Python 做健康检查（python:slim 镜像必然有 python，但没装 curl）。
      # 避免因 curl 缺失导致容器显示 unhealthy。
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ping',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        BACKEND_INTERNAL_URL: http://backend:8000
    image: hr-ai-resume-selection-frontend:1.0.0
    container_name: hr-ai-resume-selection-frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  backend-data:
  backend-logs:
