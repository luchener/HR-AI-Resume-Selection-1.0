<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">AI 简历智选</title>
  <desc id="logo-desc">AI 扫描简历并给出匹配评分的品牌标志</desc>
  <!-- 深靛蓝圆角底：与侧栏/认证卡品牌色一致 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#1B2A45"/>
  <!-- 白色简历文档 -->
  <rect x="24" y="26" width="64" height="76" rx="8" fill="#F8FAFC"/>
  <path d="M24 34a8 8 0 0 1 8-8h14v16H24Z" fill="#D8E1EE"/>
  <path d="M46 26h4v16h-4Z" fill="#F8FAFC"/>
  <!-- 履历行线 -->
  <rect x="36" y="44" width="40" height="6" rx="3" fill="#C4CFDE"/>
  <rect x="36" y="56" width="40" height="6" rx="3" fill="#C4CFDE"/>
  <rect x="36" y="68" width="26" height="6" rx="3" fill="#C4CFDE"/>
  <!-- AI 扫描线：贯穿文档下部，象征量化读取 -->
  <rect x="36" y="82" width="40" height="5" rx="2.5" fill="#78A0FF"/>
  <!-- 评分盖章徽章：深蓝圆盘 + 薄荷绿勾 -->
  <circle cx="90" cy="90" r="21" fill="#0E1F3A"/>
  <path d="m80 90 7 7 14-16" fill="none" stroke="#52E0AA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
