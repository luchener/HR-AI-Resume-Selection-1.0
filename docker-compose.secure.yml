name: hr-ai-resume-selection
services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: hr-ai-resume-selection-backend:1.0.0
    container_name: hr-ai-resume-selection-backend
    restart: unless-stopped
    env_file:
      - path: apps/backend/.env
        required: false
    environment:
      LOG_DIR: /app/logs
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD","python","-c","import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ping',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.secure
      args:
        NEXT_PUBLIC_API_URL: ""
        BACKEND_INTERNAL_URL: http://backend:8000
    image: hr-ai-resume-selection-frontend:1.0.0-secure
    container_name: hr-ai-resume-selection-frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD","wget","--no-verbose","--tries=1","--spider","http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  backend-data:
  backend-logs:
